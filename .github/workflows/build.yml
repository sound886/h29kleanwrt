name: Build H29K + FM350-GL Firmware

on:
  workflow_dispatch:
    inputs:
      use_mirror:
        description: '使用国内下载镜像(tainhua/tencent)加速源码包下载'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: build-h29k
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  OPENWRT_DIR: ${{ github.workspace }}/../openwrt

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出本仓库(构建套件)
        uses: actions/checkout@v4

      - name: 释放磁盘空间(OpenWrt 编译较吃空间)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            libssl-dev libncurses5-dev python3 rsync unzip zlib1g-dev \
            file wget curl git gettext ncurses-term libelf-dev ecj fastjar \
            java-propose-classpath lz4 ccache cmake quilt

      - name: 克隆 lean-wrt 源码(depth=1, 快)
        run: |
          git clone --depth 1 --branch master https://github.com/pw-q/lean-wrt.git "$OPENWRT_DIR"

      - name: 运行构建脚本(内含拷贝 feeds/config/files 与编译)
        working-directory: ${{ github.workspace }}
        env:
          DOWNLOAD_MIRROR: ${{ github.event.inputs.use_mirror == 'true' && 'https://mirrors.tuna.tsinghua.edu.cn/openwrt' || '' }}
        run: |
          chmod +x build.sh
          ./build.sh "$OPENWRT_DIR"

      - name: 上传固件产物(Artifact, 7天临时)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: h29k-fm350gl-sysupgrade
          path: ${{ env.OPENWRT_DIR }}/bin/targets/rockchip/armv8/openwrt-rockchip-armv8-hinlink_opc-h29k-sysupgrade.img.gz
          if-no-files-found: error
          retention-days: 7

      - name: 发布到 Release(永久保存)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: h29k-fm350gl-${{ github.run_number }}
          name: H29K FM350-GL 固件 #${{ github.run_number }}
          files: ${{ env.OPENWRT_DIR }}/bin/targets/rockchip/armv8/openwrt-rockchip-armv8-hinlink_opc-h29k-sysupgrade.img.gz
          body: |
            HinLink OPC-H29K (RK3528) + Fibocom FM350-GL 固件
            基于 lean-wrt / OpenWrt 24.10，含 fibocom-dial / qmi_wwan_f 驱动与拨号器
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
